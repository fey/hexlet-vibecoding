<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Курс валют и погода в Москве</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #6b7385;
      --accent: #2f6fed;
      --up: #1a8f4c;
      --down: #c83a3a;
      --error-bg: #fdecec;
      --error-text: #9b1c1c;
      --border: #e3e7ef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c;
        --card: #1c212b;
        --text: #e8ecf3;
        --muted: #9aa3b5;
        --accent: #6b9bff;
        --up: #4cc27f;
        --down: #ff7a7a;
        --error-bg: #3a1d1f;
        --error-text: #ffb4b4;
        --border: #2b3140;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }
    main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
    header {
      display: flex; flex-wrap: wrap; gap: 12px;
      align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    h1 { font-size: 1.6rem; margin: 0; }
    button {
      font: inherit; font-weight: 600;
      padding: 10px 20px; border: 0; border-radius: 8px;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: progress; }
    .errors { display: grid; gap: 8px; margin-bottom: 16px; }
    .error {
      background: var(--error-bg); color: var(--error-text);
      padding: 12px 16px; border-radius: 8px;
    }
    .grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
    }
    .label { color: var(--muted); font-size: .9rem; margin-bottom: 8px; }
    .value { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .note { color: var(--muted); font-size: .85rem; margin-top: 6px; }
    .up { color: var(--up); }
    .down { color: var(--down); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Курс валют и погода в Москве</h1>
      <button id="refresh" type="button">Обновить</button>
    </header>

    <div id="errors" class="errors" role="alert" aria-live="polite"></div>

    <section class="grid">
      <div class="card">
        <div class="label">USD, ₽</div>
        <div class="value" id="usd">—</div>
        <div class="note" id="usd-note"></div>
      </div>
      <div class="card">
        <div class="label">EUR, ₽</div>
        <div class="value" id="eur">—</div>
        <div class="note" id="eur-note"></div>
      </div>
      <div class="card">
        <div class="label">Температура</div>
        <div class="value" id="temp">—</div>
        <div class="note" id="temp-note"></div>
      </div>
      <div class="card">
        <div class="label">Осадки</div>
        <div class="value" id="precip">—</div>
        <div class="note" id="precip-note"></div>
      </div>
      <div class="card">
        <div class="label">Время обновления</div>
        <div class="value" id="updated">—</div>
        <div class="note" id="updated-note"></div>
      </div>
    </section>
  </main>

  <script>
    const CBR_URL = 'https://www.cbr-xml-daily.ru/daily_json.js';
    const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=55.7558&longitude=37.6173'
      + '&current=temperature_2m,apparent_temperature,precipitation,weather_code'
      + '&timezone=Europe%2FMoscow';
    const TIMEOUT_MS = 10000;

    const $ = (id) => document.getElementById(id);
    const rub = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const one = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 1 });

    // Коды погоды WMO, которые использует Open-Meteo
    const WEATHER_CODES = {
      0: 'Ясно', 1: 'Преимущественно ясно', 2: 'Переменная облачность', 3: 'Пасмурно',
      45: 'Туман', 48: 'Изморозь',
      51: 'Слабая морось', 53: 'Морось', 55: 'Сильная морось',
      56: 'Ледяная морось', 57: 'Сильная ледяная морось',
      61: 'Небольшой дождь', 63: 'Дождь', 65: 'Сильный дождь',
      66: 'Ледяной дождь', 67: 'Сильный ледяной дождь',
      71: 'Небольшой снег', 73: 'Снег', 75: 'Сильный снег', 77: 'Снежные зёрна',
      80: 'Небольшой ливень', 81: 'Ливень', 82: 'Сильный ливень',
      85: 'Снегопад', 86: 'Сильный снегопад',
      95: 'Гроза', 96: 'Гроза с градом', 99: 'Сильная гроза с градом',
    };

    async function fetchJson(url) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
      try {
        const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`сервер ответил кодом ${response.status}`);
        }
        return await response.json();
      } catch (e) {
        if (e.name === 'AbortError') throw new Error('сервер не ответил за 10 секунд');
        if (e instanceof TypeError) throw new Error('нет связи с сервером');
        throw e;
      } finally {
        clearTimeout(timer);
      }
    }

    function renderCurrency(id, valute) {
      if (!valute) throw new Error(`в ответе нет данных по ${id.toUpperCase()}`);
      $(id).textContent = rub.format(valute.Value);
      const diff = valute.Value - valute.Previous;
      const note = $(`${id}-note`);
      note.textContent = `${diff >= 0 ? '▲ +' : '▼ '}${rub.format(diff)} за день`;
      note.className = `note ${diff >= 0 ? 'up' : 'down'}`;
    }

    async function loadRates() {
      const data = await fetchJson(CBR_URL);
      renderCurrency('usd', data.Valute?.USD);
      renderCurrency('eur', data.Valute?.EUR);
      const date = new Date(data.Date).toLocaleDateString('ru-RU');
      $('usd-note').textContent += ` · ЦБ РФ на ${date}`;
      $('eur-note').textContent += ` · ЦБ РФ на ${date}`;
    }

    async function loadWeather() {
      const data = await fetchJson(WEATHER_URL);
      const c = data.current;
      if (!c) throw new Error('в ответе нет текущей погоды');
      $('temp').textContent = `${one.format(c.temperature_2m)} °C`;
      $('temp-note').textContent = `Ощущается как ${one.format(c.apparent_temperature)} °C`;
      $('precip').textContent = `${one.format(c.precipitation)} мм`;
      $('precip-note').textContent = WEATHER_CODES[c.weather_code] ?? `Код погоды ${c.weather_code}`;
    }

    function resetCards() {
      for (const id of ['usd', 'eur', 'temp', 'precip']) {
        $(id).textContent = '…';
        $(`${id}-note`).textContent = '';
        $(`${id}-note`).className = 'note';
      }
    }

    function showError(text) {
      const div = document.createElement('div');
      div.className = 'error';
      div.textContent = text;
      $('errors').append(div);
    }

    async function refresh() {
      const button = $('refresh');
      button.disabled = true;
      button.textContent = 'Загрузка…';
      $('errors').replaceChildren();
      resetCards();

      const [rates, weather] = await Promise.allSettled([loadRates(), loadWeather()]);

      if (rates.status === 'rejected') {
        $('usd').textContent = '—';
        $('eur').textContent = '—';
        showError(`Не удалось загрузить курсы валют ЦБ РФ: ${rates.reason.message}. Попробуйте нажать «Обновить» позже.`);
      }
      if (weather.status === 'rejected') {
        $('temp').textContent = '—';
        $('precip').textContent = '—';
        showError(`Не удалось загрузить погоду Open-Meteo: ${weather.reason.message}. Попробуйте нажать «Обновить» позже.`);
      }

      const now = new Date();
      $('updated').textContent = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      $('updated-note').textContent = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

      button.disabled = false;
      button.textContent = 'Обновить';
    }

    $('refresh').addEventListener('click', refresh);
    refresh();
  </script>
</body>
</html>
